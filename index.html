<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SILENT MOD - Device Verification</title>
    
    <!-- Google Fonts: Orbitron & Noto Sans & Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Noto+Sans:wght@400;600;700&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config for Custom Colors, Fonts, and Animations -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#0b0b0f',
                        bgLight: '#1f180c',
                        cardBg: 'rgba(20, 18, 15, 0.85)',
                        accentGold: '#ffb700',
                        accentOrange: '#ff8800',
                        textMuted: '#d4af37',
                    },
                    fontFamily: {
                        noto: ['"Noto Sans"', 'sans-serif'],
                        orbitron: ['Orbitron', 'sans-serif'],
                        fira: ['"Fira Code"', 'monospace'],
                    },
                    animation: {
                        fadeIn: 'fadeIn 0.8s ease-in-out',
                        floatUp: 'floatUp 10s infinite linear',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        floatUp: {
                            '0%': { transform: 'translateY(110vh) rotate(0deg)', opacity: '0' },
                            '50%': { opacity: '0.6' },
                            '100%': { transform: 'translateY(-10vh) rotate(360deg)', opacity: '0' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bgDark bg-[radial-gradient(circle_at_center,_#1f180c_0%,_#0b0b0f_100%)] text-white h-screen flex justify-center items-center overflow-hidden font-noto m-0 p-0 box-border">

    <!-- Widget Container -->
    <div class="relative z-10 bg-cardBg border border-accentGold/40 backdrop-blur-[20px] py-9 px-6 rounded-[22px] text-center shadow-[0_20px_40px_rgba(0,0,0,0.8),0_0_30px_rgba(255,183,0,0.2)] max-w-[420px] w-[90%] animate-fadeIn">
        
        <!-- Logo & Header -->
        <div class="flex flex-col items-center mb-4">
            <a href="https://t.me/EliteMods_Hub" target="_blank" class="inline-block transition-transform duration-300 hover:scale-105">
                <img src="Elite.jpg" alt="SILENT MOD" class="w-[85px] h-[85px] rounded-full object-cover block mx-auto mb-3 border-2 border-accentGold shadow-[0_0_20px_rgba(255,183,0,0.4)]">
            </a>
            <h3 class="m-0 text-accentGold font-orbitron tracking-[2px] text-xl drop-shadow-[0_0_12px_rgba(255,183,0,0.5)]">SILENT MOD</h3>
        </div>
        
        <p class="text-[0.8rem] text-textMuted mb-5 tracking-[1.5px] font-semibold">DEVICE VERIFICATION PORTAL</p>
        
        <!-- Dynamic Status Display Box -->
        <div id="finalKeyDisplay" class="bg-[#0a0805]/70 border-2 border-dashed border-accentGold text-white font-fira text-[1.1rem] font-bold py-4 px-3 mb-6 rounded-xl break-all min-h-[65px] flex items-center justify-center shadow-[inset_0_0_20px_rgba(255,183,0,0.15)] tracking-[0.5px]">
            Verifying Session...
        </div>

        <!-- Action Button -->
        <button id="actionBtn" class="bg-gradient-to-br from-accentGold to-accentOrange text-[#0b0b0f] border-none py-3.5 px-8 font-orbitron text-[0.95rem] font-extrabold tracking-[1px] rounded-full cursor-pointer transition-all duration-300 uppercase shadow-[0_5px_20px_rgba(255,183,0,0.4)] w-full mb-5">
            PLEASE WAIT...
        </button>

        <!-- Footer Link -->
        <div class="mt-4 border-t border-accentGold/15 pt-4">
            <a href="https://t.me/SILENT_MOD_SG" target="_blank" class="text-textMuted no-underline font-fira text-[0.9rem] font-semibold tracking-[1px] inline-flex items-center gap-1.5 hover:text-accentGold">
                <span>@SILENT_MOD_SG</span>
            </a>
        </div>
    </div>

    <!-- JavaScript for Firebase Verification & Expiry Generation -->
    <script>
        const FIREBASE_URL = "https://silent-mod-dialogue-default-rtdb.asia-southeast1.firebasedatabase.app";

        window.addEventListener('load', async function() {
            const displayBox = document.getElementById("finalKeyDisplay");
            const actionBtn = document.getElementById("actionBtn");

            const urlParams = new URLSearchParams(window.location.search);
            const hwid = urlParams.get('hwid');
            const token = urlParams.get('token');

            if (!hwid || !token) {
                showError("Invalid Link: Missing Parameters!");
                return;
            }

            try {
                // 1. Fetch OTP Request from Firebase using HWID as key
                let otpRes = await fetch(`${FIREBASE_URL}/otp_requests/${hwid}.json`);
                let otpData = await otpRes.json();

                if (!otpData || otpData.token !== token) {
                    showError("Link Expired or Already Used (Replay Attack Blocked)!");
                    return;
                }

                // 2. Fetch Global Access Hours from Settings
                let settingsRes = await fetch(`${FIREBASE_URL}/settings/global_config/access_hours.json`);
                let accessHours = await settingsRes.json();
                if (!accessHours) accessHours = 24;

                // 3. Calculate Expiry Date/Time
                let expiryDate = new Date(new Date().getTime() + (accessHours * 60 * 60 * 1000));
                let formattedExpiry = formatDate(expiryDate);

                // 4. Prepare User Data payload
                let userData = {
                    expiry: formattedExpiry,
                    packageName: otpData.packageName || "com_silent_defaultapp",
                    appName: otpData.appName || "SILENT MOD",
                    model: otpData.model || "Unknown Device",
                    hwid: hwid
                };

                // 5. Save to /users/<HWID>
                let saveRes = await fetch(`${FIREBASE_URL}/users/${hwid}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                if (saveRes.ok) {
                    // 6. Delete temporary OTP request so link cannot be reused
                    await fetch(`${FIREBASE_URL}/otp_requests/${hwid}.json`, {
                        method: 'DELETE'
                    });

                    // Success UI
                    displayBox.innerText = `Verified Successfully!\nAccess Granted for ${accessHours} Hours.`;
                    displayBox.style.borderColor = "#00ffcc";
                    displayBox.style.color = "#00ffcc";

                    actionBtn.innerText = "OPEN TELEGRAM / APP";
                    actionBtn.onclick = function() {
                        window.location.href = "https://t.me/SILENT_MOD_SG";
                    };
                } else {
                    showError("Database Write Failed. Try Again.");
                }

            } catch (err) {
                console.error(err);
                showError("Connection Error! Check Internet.");
            }
        });

        function showError(msg) {
            const displayBox = document.getElementById("finalKeyDisplay");
            const actionBtn = document.getElementById("actionBtn");

            displayBox.innerText = msg;
            displayBox.style.borderColor = "#ff4d4d";
            displayBox.style.color = "#ff4d4d";

            actionBtn.innerText = "JOIN TELEGRAM";
            actionBtn.onclick = function() {
                window.location.href = "https://t.me/SILENT_MOD_SG";
            };
        }

        function formatDate(date) {
            let year = date.getFullYear();
            let month = String(date.getMonth() + 1).padStart(2, '0');
            let day = String(date.getDate()).padStart(2, '0');
            let hours = String(date.getHours()).padStart(2, '0');
            let minutes = String(date.getMinutes()).padStart(2, '0');
            let seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }
    </script>
</body>
</html>
